name: formaia_app
description: App móvil de rutinas de ejercicio personalizadas con IA (FormaIA).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Cliente HTTP oficial de Dart: usado por ApiClient para hablar con el
  # backend en C++ (ver lib/core/api_client.dart).
  http: ^1.2.1

  # Gestión de estado simple con ChangeNotifier + Provider. Se eligió por
  # ser la opción más liviana y estándar; no agrega generación de código
  # (a diferencia de Riverpod con build_runner), lo que reduce el riesgo
  # de problemas de compilación en un scaffold que no se pudo probar aquí.
  provider: ^6.1.2

  # Almacenamiento local simple (persistir el usuario_id de la sesión y la
  # solicitud/rutina activa) sin permisos nativos adicionales.
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
